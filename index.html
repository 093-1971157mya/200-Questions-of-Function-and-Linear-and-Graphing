<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Assessment System - Linear Equations & Graphing</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Security Rules: Disable text selection and copy/paste */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans" oncontextmenu="return false;">

  <!-- Header & Circular Clock Timer -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div>
      <h1 class="text-xl font-bold text-indigo-400">Functions & Graphing Assessment</h1>
      <p class="text-xs text-slate-400">30 Questions • 45 Minutes • No Pause</p>
    </div>

    <!-- SVG Circular Countdown Clock -->
    <div class="flex items-center space-x-3 bg-slate-900 px-4 py-2 rounded-xl border border-slate-700">
      <div class="relative w-12 h-12 flex items-center justify-center">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
          <path class="text-slate-700" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path id="timer-progress" class="text-indigo-500 transition-all duration-1000 ease-linear" stroke-dasharray="100, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <span id="timer-display" class="absolute text-[10px] font-mono font-bold text-indigo-300">45:00</span>
      </div>
      <div>
        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Time Remaining</div>
        <div id="status-badge" class="text-xs text-emerald-400 font-semibold">In Progress</div>
      </div>
    </div>
  </header>

  <!-- Main Exam Screen -->
  <main id="exam-screen" class="max-w-4xl mx-auto w-full p-6 flex-grow flex flex-col justify-between">
    <div>
      <!-- Progress Bar & Question Tracker -->
      <div class="flex items-center justify-between mb-4 text-sm text-slate-400">
        <span>Question <strong id="current-num" class="text-white">1</strong> of 30</span>
        <span id="domain-badge" class="bg-indigo-900/60 text-indigo-300 text-xs px-2.5 py-1 rounded-full border border-indigo-700">Domain</span>
      </div>

      <!-- Question Card -->
      <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl mb-6">
        <h2 id="question-text" class="text-lg font-medium text-slate-100 mb-6">Loading question...</h2>

        <!-- Dynamic Visual Container (Tables / Graphs) -->
        <div id="visual-container" class="mb-6 hidden"></div>

        <!-- Options Container -->
        <div id="options-container" class="space-y-3"></div>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800">
      <button id="prev-btn" onclick="navigate(-1)" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium disabled:opacity-40 transition">
        Previous
      </button>

      <div class="flex items-center space-x-3">
        <button id="next-btn" onclick="navigate(1)" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
          Next Question
        </button>
        <button id="submit-btn" onclick="confirmSubmit()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium transition">
          Submit Exam
        </button>
      </div>
    </div>
  </main>

  <!-- Score Screen (Hidden by default) -->
  <div id="score-screen" class="hidden max-w-2xl mx-auto w-full p-8 my-auto bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl text-center">
    <div class="w-20 h-20 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">Assessment Completed</h2>
    <p class="text-slate-400 mb-6">Your responses have been processed successfully.</p>

    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="text-2xl font-bold text-indigo-400" id="final-score">0 / 30</div>
        <div class="text-xs text-slate-400">Correct Answers</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="text-2xl font-bold text-emerald-400" id="final-percent">0%</div>
        <div class="text-xs text-slate-400">Final Score</div>
      </div>
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
        <div class="text-2xl font-bold text-amber-400" id="final-time">00:00</div>
        <div class="text-xs text-slate-400">Time Spent</div>
      </div>
    </div>

    <button onclick="location.reload()" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">
      Take New Randomized Test
    </button>
  </div>

  <script>
    // --- 1. Master Question Bank (Simulated 100-Item Pool Engine) ---
    function generateQuestionBank() {
      const bank = [];
      
      // Domain 1: Slope & Rate of Change (25 Qs)
      for (let i = 1; i <= 25; i++) {
        const x1 = i % 5, y1 = i * 2;
        const x2 = x1 + 3, y2 = y1 - 6;
        const m = (y2 - y1) / (x2 - x1);
        bank.push({
          id: `d1_${i}`,
          domain: "Slope & Rate of Change",
          question: `Find the slope of the line passing through the points (${x1}, ${y1}) and (${x2}, ${y2}).`,
          options: [`m = ${m}`, `m = ${-m}`, `m = ${m + 2}`, `m = ${1/m}`],
          correctIndex: 0
        });
      }

      // Domain 2: Data Tables & Functions (25 Qs)
      for (let i = 1; i <= 25; i++) {
        bank.push({
          id: `d2_${i}`,
          domain: "Data Tables & Linear Functions",
          question: `What is the rate of change represented in the linear table below?`,
          tableData: { x: [-2, 0, 2, 4], y: [10 - i, 10 - i + 4, 10 - i + 8, 10 - i + 12] },
          options: [`m = 2`, `m = 4`, `m = -2`, `m = 1/2`],
          correctIndex: 0
        });
      }

      // Domain 3: Equations & Intercepts (25 Qs)
      for (let i = 1; i <= 25; i++) {
        const b = i % 7;
        bank.push({
          id: `d3_${i}`,
          domain: "Equations & Intercepts",
          question: `Identify the y-intercept of the line given by the equation y = 3x + ${b}.`,
          options: [`(0, ${b})`, `(${b}, 0)`, `(0, 3)`, `(3, ${b})`],
          correctIndex: 0
        });
      }

      // Domain 4: Graphing & Function Evaluation (25 Qs)
      for (let i = 1; i <= 25; i++) {
        const val = i + 2;
        bank.push({
          id: `d4_${i}`,
          domain: "Function Notation",
          question: `If f(x) = -2x + 10, evaluate f(${val}).`,
          options: [`${-2 * val + 10}`, `${2 * val + 10}`, `${-2 * val - 10}`, `${val + 10}`],
          correctIndex: 0
        });
      }

      return bank;
    }

    // --- 2. Randomization Engine ---
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function prepareExam() {
      const fullBank = generateQuestionBank();
      const sampled = shuffleArray(fullBank).slice(0, 30); // Pick 30 random questions

      return sampled.map(q => {
        // Shuffle answer options while maintaining reference to correct choice
        const choices = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correctIndex }));
        const shuffledChoices = shuffleArray(choices);
        return {
          ...q,
          options: shuffledChoices.map(c => c.text),
          correctIndex: shuffledChoices.findIndex(c => c.isCorrect)
        };
      });
    }

    // --- 3. Exam State Management ---
    let examData = prepareExam();
    let currentIndex = 0;
    let userAnswers = new Array(30).fill(null);
    let totalSeconds = 45 * 60; // 45 Minutes
    let remainingSeconds = totalSeconds;
    let timerInterval = null;

    // --- 4. Timer Logic ---
    function startTimer() {
      const timerDisplay = document.getElementById('timer-display');
      const timerProgress = document.getElementById('timer-progress');

      timerInterval = setInterval(() => {
        remainingSeconds--;

        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        // Update Circular Ring
        const percent = (remainingSeconds / totalSeconds) * 100;
        timerProgress.setAttribute('stroke-dasharray', `${percent}, 100`);

        if (remainingSeconds <= 300) { // Last 5 minutes warning
          timerProgress.classList.remove('text-indigo-500');
          timerProgress.classList.add('text-rose-500');
        }

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    // --- 5. Render Question UI ---
    function renderQuestion() {
      const q = examData[currentIndex];
      document.getElementById('current-num').textContent = currentIndex + 1;
      document.getElementById('domain-badge').textContent = q.domain;
      document.getElementById('question-text').textContent = q.question;

      // Render Visuals (Tables)
      const visualContainer = document.getElementById('visual-container');
      if (q.tableData) {
        visualContainer.classList.remove('hidden');
        visualContainer.innerHTML = `
          <div class="overflow-x-auto max-w-md mx-auto my-2">
            <table class="w-full text-center border-collapse border border-slate-700 bg-slate-900 rounded-lg">
              <thead>
                <tr class="bg-slate-800 text-indigo-300"><th class="border border-slate-700 p-2">x</th>${q.tableData.x.map(val => `<td class="border border-slate-700 p-2">${val}</td>`).join('')}</tr>
              </thead>
              <tbody>
                <tr class="text-slate-200"><th class="border border-slate-700 p-2 bg-slate-800 text-indigo-300">y</th>${q.tableData.y.map(val => `<td class="border border-slate-700 p-2">${val}</td>`).join('')}</tr>
              </tbody>
            </table>
          </div>`;
      } else {
        visualContainer.classList.add('hidden');
        visualContainer.innerHTML = '';
      }

      // Render Options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((optText, idx) => {
        const isSelected = userAnswers[currentIndex] === idx;
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-4 rounded-xl border transition flex items-center justify-between ${
          isSelected 
            ? 'bg-indigo-600/20 border-indigo-500 text-indigo-200' 
            : 'bg-slate-900/50 border-slate-700 text-slate-300 hover:bg-slate-700/50'
        }`;
        btn.onclick = () => selectOption(idx);
        btn.innerHTML = `
          <span class="flex items-center space-x-3">
            <span class="w-6 h-6 rounded-full border text-xs font-bold flex items-center justify-center ${
              isSelected ? 'border-indigo-400 bg-indigo-500 text-white' : 'border-slate-600 text-slate-400'
            }">${String.fromCharCode(65 + idx)}</span>
            <span>${optText}</span>
          </span>`;
        optionsContainer.appendChild(btn);
      });

      // Update Nav Buttons
      document.getElementById('prev-btn').disabled = currentIndex === 0;
      document.getElementById('next-btn').style.display = currentIndex === 29 ? 'none' : 'block';
      document.getElementById('submit-btn').style.display = currentIndex === 29 ? 'block' : 'none';
    }

    function selectOption(index) {
      userAnswers[currentIndex] = index;
      renderQuestion();
    }

    function navigate(direction) {
      currentIndex += direction;
      renderQuestion();
    }

    function confirmSubmit() {
      const unanswered = userAnswers.filter(a => a === null).length;
      if (unanswered > 0) {
        if (!confirm(`You have ${unanswered} unanswered questions. Are you sure you want to submit?`)) return;
      }
      submitExam();
    }

    function submitExam() {
      clearInterval(timerInterval);
      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === examData[idx].correctIndex) score++;
      });

      const percentage = Math.round((score / 30) * 100);
      const timeSpentSecs = totalSeconds - remainingSeconds;
      const spentMins = Math.floor(timeSpentSecs / 60);
      const spentSecs = timeSpentSecs % 60;

      document.getElementById('exam-screen').classList.add('hidden');
      document.getElementById('score-screen').classList.remove('hidden');

      document.getElementById('final-score').textContent = `${score} / 30`;
      document.getElementById('final-percent').textContent = `${percentage}%`;
      document.getElementById('final-time').textContent = `${spentMins}m ${spentSecs}s`;
    }

    // --- 6. Anti-Cheat Security Event Listeners ---
    document.addEventListener('copy', (e) => e.preventDefault());
    document.addEventListener('cut', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      // Block Ctrl+C, Ctrl+U, F12 inspect
      if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i') || e.key === 'F12') {
        e.preventDefault();
      }
    });

    // --- Initialization ---
    renderQuestion();
    startTimer();
  </script>
</body>
</html>
